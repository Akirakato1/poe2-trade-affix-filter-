<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>POE2 Affix Filter</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="bar">
        <strong>Affix Filter</strong>
        <div class="header-actions">
          <button id="hotkeySettings" class="hotkey" title="Change live-filter shortcut" type="button">
            <span id="hotkeyLabel">...</span>
          </button>
          <label class="toggle live-toggle">
            <input id="liveToggle" type="checkbox">
            <span>Live</span>
          </label>
        </div>
      </header>

      <section class="section">
        <div class="row">
          <select id="profileSelect" title="Saved filters"></select>
          <button id="prevProfile" title="Previous profile" type="button">&lt;</button>
          <button id="nextProfile" title="Next profile" type="button">&gt;</button>
        </div>
        <div class="row buttons">
          <button id="saveProfile" type="button">Save</button>
          <button id="shareProfile" type="button">Share</button>
          <button id="importProfile" type="button">Import</button>
          <button id="renameProfile" type="button">Rename</button>
          <button id="deleteProfile" type="button">Delete</button>
          <button id="newProfile" type="button">New</button>
        </div>
        <div id="importPanel" class="import-panel" hidden>
          <textarea id="importProfileText" rows="3" spellcheck="false"></textarea>
          <div class="row buttons">
            <button id="confirmImportProfile" class="primary" type="button">Import</button>
            <button id="cancelImportProfile" type="button">Cancel</button>
          </div>
        </div>
        <div id="profileNamePanel" class="name-panel" hidden>
          <label>
            <span id="profileNameLabel">Profile name</span>
            <input id="profileNameInput" type="text" autocomplete="off">
          </label>
          <div class="row buttons">
            <button id="confirmProfileName" class="primary" type="button">Save</button>
            <button id="cancelProfileName" type="button">Cancel</button>
          </div>
        </div>
      </section>

      <section class="section">
        <label>
          Trade link
          <div class="trade-link-row">
            <a id="tradeLinkAnchor" class="trade-link-anchor" target="_blank" rel="noreferrer" hidden></a>
            <input id="tradeLinkInput" type="url" placeholder="Paste trade link">
            <button id="tradeLinkToggle" class="icon-button" title="Save trade link" type="button" aria-label="Save trade link">✓</button>
          </div>
        </label>
        <label>
          Item group
          <select id="groupSelect"></select>
        </label>
        <label>
          Item type
          <select id="subtypeSelect"></select>
        </label>
      </section>

      <section class="section">
        <div class="row buttons">
          <button id="addAndGroup" type="button">AND</button>
          <button id="addNotGroup" type="button">NOT</button>
          <button id="addCountGroup" type="button">COUNT</button>
        </div>
      </section>

      <section id="groups" class="groups"></section>

      <footer id="status" class="status">Live filtering is off by default. Hotkey toggles Live.</footer>
      <div id="toast" class="toast" hidden></div>
    </main>

    <script src="shared/profile-store.js"></script>
    <script src="shared/mod-options.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
